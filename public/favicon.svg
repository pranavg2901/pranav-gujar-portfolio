<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pranav Gujar">
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <!-- A filled geometric P: stem, bowl, and a punched counter. Built from
       primitives rather than set in a font, so the SVG and the PNG fallbacks
       are identical and the counter stays open at 16px. -->
  <rect x="18" y="13" width="10" height="38" rx="2" fill="#c3f53c"/>
  <circle cx="34" cy="25" r="13" fill="#c3f53c"/>
  <circle cx="34" cy="25" r="5.5" fill="#050505"/>
</svg>
