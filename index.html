<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pranav Gujar — Software Engineer</title>
    <meta
      name="description"
      content="Pranav Gujar, software engineer in Pune. I build production Python backends, data pipelines and AI workflows, and run them end to end."
    />
    <meta name="author" content="Pranav Gujar" />
    <!-- max-image-preview:large is what lets Google show the social card
         rather than a thumbnail beside the result. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon-180.png" />
    <meta name="theme-color" content="#c3f53c" />
    <link rel="canonical" href="https://pranavg2901.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pranav Gujar — Software Engineer" />
    <meta
      property="og:description"
      content="Backend systems and applied AI. Python, FastAPI, LangGraph, Postgres — shipped and supported in production."
    />
    <meta property="og:url" content="https://pranavg2901.github.io/" />
    <!-- A real 1200x630 card, generated by scripts/og-card.py. The square
         favicon used to sit here, which every feed cropped into a strip of
         lime with nothing legible in it. -->
    <meta property="og:image" content="https://pranavg2901.github.io/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pranav Gujar — software engineer, backend systems and applied AI"
    />
    <meta property="og:site_name" content="Pranav Gujar" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pranavg2901.github.io/og-card.png" />

    <!-- The fonts are served from this origin (see src/styles/tokens.css).
         Preloaded so they are already in flight while the stylesheet that
         declares them is still being parsed. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Replaced at build time by scripts/prerender.mjs with the structured
         data for this page. Left empty here so the dev server and the built
         site never disagree about which copy is authoritative. -->
    <script type="application/ld+json" data-structured-data>{}</script>

    <script>
      // Runs before first paint: marks that scripting is available (Reveal uses
      // it to gate its hidden starting state) and applies the saved theme so
      // the page never flashes the wrong one.
      ;(() => {
        document.documentElement.classList.add('js')
        try {
          // Light is the default. Dark is applied only when the visitor has
          // chosen it, rather than following the operating system.
          const dark = localStorage.getItem('theme') === 'dark'
          document.documentElement.classList.toggle('dark', dark)
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
