name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The page description and the structured data are generated at build time
  # and include how long I have been working, which changes every month. A
  # rebuild on the 1st keeps what a search engine reads in step with what the
  # page itself computes on every visit.
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: the build scripts import the TypeScript content files
          # directly and rely on Node stripping the types without a flag.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional override only. The working key is committed in
          # src/content/site.ts, since it is public by design and ships in the
          # bundle regardless. Set this repo variable to rotate the key
          # without touching code; leaving it unset is fine.
          VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
